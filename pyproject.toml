[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tutor-any-lecture"
dynamic = ["version"]
description = "Turn any lecture video, recording or slide deck into a tutor: pretest, cited explanation, graded quiz, Anki review"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pyyaml>=6",
  "pdfplumber>=0.11",
  "yt-dlp>=2025.1.1",
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
# Speech recognition, only for audio or video without captions: pip install "tutor-any-lecture[asr]".
asr = [
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "faster-whisper>=1.1; sys_platform != 'darwin' or platform_machine != 'arm64'",
]
dev = ["pytest>=8"]

[project.scripts]
tutor-any-lecture = "tutor_any_lecture.cli:main"

[tool.hatch.version]
path = "src/tutor_any_lecture/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tutor_any_lecture"]

# An allow-list: nothing else in the checkout (docs, tests, skills, planning files) goes into an sdist.
[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "README.md",
  "README.zh-CN.md",
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
markers = ["slow: needs a real cached ASR model; deselect with -m 'not slow'"]
