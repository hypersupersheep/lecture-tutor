# lecture-tutor 配置。复制到 ~/.config/lecture-tutor/config.yaml 再改。路径可以用 ~ 开头。

course_root: ~/Courses/2026-27          # 课程资料根目录:每门课一个文件夹,课件按周放在 <folder>/weekN/
vault_root: ~/Obsidian/MyVault/Courses  # Obsidian vault 里放课程笔记的文件夹;不用 Obsidian 就写 ""
python: python3                         # 装好 requirements.txt 的解释器,比如某个 conda 环境里的 python

moodle_url: https://moodle.example.ac.uk
panopto_url: https://example.cloud.panopto.eu

courses:
  - code: COURSE101                     # 对话里怎么称呼这门课
    name: Stochastic Systems
    moodle_id: 12345                    # 课程页 URL 里 course/view.php?id= 后面的数字
    folder: course101                   # course_root 和 vault_root 下这门课的文件夹名
    numbering: week                     # week:一周几节合成一份(W04);session:每节一份(S01)
  - code: FIN201
    name: Financial Markets
    moodle_id: 67890
    folder: fin201
    numbering: session
