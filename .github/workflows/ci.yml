name: ci

on:
  push:
  pull_request:

# No job installs the asr extra: doctor must report ready without speech recognition.

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv pip install --system -e .[dev]
      - name: Tests
        run: python -m pytest -q -m "not slow"
      - name: Selftest
        run: tutor-any-lecture selftest
      - name: Doctor (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: tutor-any-lecture doctor --json
      - name: Doctor (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          tutor-any-lecture doctor --json
          exit $LASTEXITCODE

  install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Dry run (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: bash install.sh --dry-run
      - name: Dry run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh -NoProfile -File install.ps1 -DryRun
          exit $LASTEXITCODE
      - name: Real install (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: bash install.sh --yes --from . --agents claude
      - name: Real install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh -NoProfile -File install.ps1 -Yes -From . -Agents claude
          exit $LASTEXITCODE
      - name: Selftest via recorded CLI path (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cli="$(head -n 1 "${XDG_CONFIG_HOME:-$HOME/.config}/tutor-any-lecture/cli-path")"
          "$cli" selftest
      - name: Selftest via recorded CLI path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cli = (Get-Content -LiteralPath "$env:APPDATA\tutor-any-lecture\cli-path" -TotalCount 1 -Encoding UTF8).Trim()
          & $cli selftest
          exit $LASTEXITCODE

      # The same installer under Windows PowerShell 5.1, which stock Windows ships.
      - name: Dry run (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -DryRun
          exit $LASTEXITCODE
      - name: Real install (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Yes -From . -Agents claude
          exit $LASTEXITCODE
      - name: Selftest via recorded CLI path (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $cli = (Get-Content -LiteralPath "$env:APPDATA\tutor-any-lecture\cli-path" -TotalCount 1 -Encoding UTF8).Trim()
          & $cli selftest
          exit $LASTEXITCODE

      # One more real install from a copy of the checkout in a folder whose name
      # has a space and CJK characters.
      - name: Install from a folder with a space and CJK characters (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          dest="$RUNNER_TEMP/课程 资料/tutor-any-lecture"
          mkdir -p "$dest"
          cp -R . "$dest"
          bash "$dest/install.sh" --yes --agents claude
          cli="$(head -n 1 "${XDG_CONFIG_HOME:-$HOME/.config}/tutor-any-lecture/cli-path")"
          "$cli" selftest
      - name: Install from a folder with a space and CJK characters (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP '课程 资料\tutor-any-lecture'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Get-ChildItem -Force -LiteralPath . | Copy-Item -Destination $dest -Recurse -Force
          pwsh -NoProfile -File (Join-Path $dest 'install.ps1') -Yes -Agents claude
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cli = (Get-Content -LiteralPath "$env:APPDATA\tutor-any-lecture\cli-path" -TotalCount 1 -Encoding UTF8).Trim()
          & $cli selftest
          exit $LASTEXITCODE
